name: cloudtrack
description: "App de gerenciamento logístico com Supabase e Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_strategy: ^0.2.0
  url_launcher: ^6.2.6
  font_awesome_flutter: ^10.5.0
  excel: ^2.1.0
  package_info_plus: ^9.0.0
  

  # Ícones iOS
  cupertino_icons: ^1.0.8

  # Banco de dados e autenticação
  supabase_flutter: ^2.10.3

  # Interop JavaScript (necessário para @JS e dart:js_interop)
  js: ^0.7.1

  # Variáveis de ambiente
  flutter_dotenv: ^6.0.0

  # Animações e utilidades
  flutter_animate: ^4.5.0
  dio: ^5.9.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  universal_html: ^2.2.4
  mask_text_input_formatter: ^2.9.0

  # Formatação (datas, moeda, milhar)
  intl: ^0.20.2

  # PDF e IO
  pdf: ^3.12.0
  printing: ^5.14.3
  universal_io: ^2.3.0
  mime: ^1.0.4
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700