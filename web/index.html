<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Base-X App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Base-X">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="icons/favicon.ico"/>
  <title>Base-X</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Detecta atualizações do service worker e força ativação imediata
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (!reg) return;

          // Se já existe um SW esperando, ativa imediatamente
          if (reg.waiting) {
            reg.waiting.postMessage('skipWaiting');
          }

          // Quando uma nova versão é encontrada, força ativação
          reg.addEventListener('updatefound', function () {
            var newWorker = reg.installing;
            if (!newWorker) return;

            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('Nova versão disponível, ativando...');
                newWorker.postMessage('skipWaiting');
              }
            });
          });
        });

        // Quando o novo SW assume controle, recarrega a página
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          console.log('Service worker atualizado, recarregando...');
          window.location.reload();
        });
      });
    }

    // Função global para atualização: limpa tudo e força navegação fresh
    window.atualizarApp = async function () {
      try {
        console.log('Iniciando atualização do app...');

        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
        }

        if (window.caches) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }

        // Navega com cache-bust para forçar o browser a buscar tudo do servidor
        var url = new URL(window.location.href);
        url.searchParams.set('cache_bust', Date.now());
        window.location.replace(url.toString());
      } catch (e) {
        console.error('Erro ao atualizar app:', e);
        window.location.replace(window.location.pathname + '?cache_bust=' + Date.now());
      }
    };
  </script>
</body>
</html>
